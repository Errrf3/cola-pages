  var container = document.getElementById('cardsContainer');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">馃樁</div><p>娌℃湁鎵惧埌鍖归厤鐨勫矖浣嶏紝璇曡瘯璋冩暣绛涢€夋潯浠?/p></div>';
  } else {
    container.innerHTML = filtered.map(function(item) {
      var positions = (item.positions && item.positions.length > 0 && item.positions[0])
        ? item.positions.map(function(p) {
            return '<span class="position-tag">' + escHtml(p) + '</span>';
          }).join('')
        : '';
      var cities = (item.cities && item.cities.length > 0)
        ? item.cities.map(function(c) {
            return '<span class="city-tag">' + escHtml(c) + '</span>';
          }).join('')
        : '';
      
      var sections = [];

      // Positions
      if (positions) {
        sections.push('<div class="info-section"><div class="info-label">馃搵 鎷涜仒宀椾綅</div><div class="positions-list">' + positions + '</div></div>');
      }

      // Requirements + Target
      var reqLines = [];
      if (item.target) reqLines.push('<strong>闈㈠悜锛?/strong>' + escHtml(item.target));
      if (item.requirements) reqLines.push('<strong>瑕佹眰锛?/strong>' + escHtml(typeof item.requirements === 'string' ? item.requirements : item.requirements.join('锛?)));
      if (reqLines.length > 0) {
        sections.push('<div class="info-section"><div class="info-label">馃摑 宀椾綅瑕佹眰</div><div class="info-text">' + reqLines.join('<br>') + '</div></div>');
      }

      // Cities
      if (cities) {
        sections.push('<div class="info-section"><div class="info-label">馃搷 宸ヤ綔鍦扮偣</div><div class="city-list">' + cities + '</div></div>');
      }

      // Apply method + link
      var applyParts = [];
      if (item.applyMethod) applyParts.push('<strong>鎶曢€掓柟寮忥細</strong>' + escHtml(item.applyMethod));
      if (item.applyLink) {
        var displayLink = item.applyLink.length > 50 ? item.applyLink.substring(0, 50) + '...' : item.applyLink;
        applyParts.push('<a class="apply-link" href="' + escHtml(item.applyLink) + '" target="_blank" rel="noopener">馃敆 ' + escHtml(displayLink) + '</a>');
      }
      if (applyParts.length > 0) {
        sections.push('<div class="info-section"><div class="info-label">馃摦 鎶曢€掓柟寮?/div><div class="info-text">' + applyParts.join('<br>') + '</div></div>');
      }

      // Process
      if (item.process) {
        sections.push('<div class="info-section"><div class="info-label">馃攧 鎷涜仒娴佺▼</div><div class="process-text">' + escHtml(item.process) + '</div></div>');
      }

      // Address
      if (item.address && item.address.length > 3) {
        sections.push('<div class="info-section"><div class="info-label">馃彚 鍏徃鍦板潃</div><div class="info-text" style="font-size:0.82rem">' + escHtml(item.address) + '</div></div>');
      }

      return '<div class="job-card">' +
        '<div class="card-header">' +
          getLogo(item.company, item.industry) +
          '<div class="card-title-section">' +
            '<div class="card-company-row">' +
              '<span class="card-company">' + escHtml(item.company) + '</span>' +
              '<span class="card-date">' + formatDate(item.date) + '</span>' +
            '</div>' +
            '<div class="badge-row">' +
              '<span class="badge ' + (badgeClasses[item.industry] || '') + '" style="' + (badgeClasses[item.industry] ? '' : 'background:#f8fafc;color:#475569') + '">' + escHtml(item.industry) + '</span>' +
              (item.target ? '<span class="badge badge-target">馃幆 ' + escHtml(item.target) + '</span>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-body">' + sections.join('') + '</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('resultCount').textContent = '鍏?' + filtered.length + ' 鏉?;
  updateStats();
}

function updateStats() {
  document.getElementById('totalCount').textContent = DATA.length;
  document.getElementById('energyCount').textContent = DATA.filter(function(i){return i.industry==='鐢靛姏鑳芥簮'}).length;
  document.getElementById('financeCount').textContent = DATA.filter(function(i){return i.industry==='閲戣瀺璇佸埜'}).length;
  document.getElementById('techCount').textContent = DATA.filter(function(i){return i.industry==='浜掕仈缃戠鎶€'}).length;
  document.getElementById('mfgCount').textContent = DATA.filter(function(i){return i.industry==='鍒堕€犱笟'}).length;
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('industryFilter').value = '';
  renderCards();
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('updateTime').textContent = '馃搮 鏁版嵁鏇存柊锛?026-08-04 路 鍏?' + DATA.length + ' 鏉″矖浣嶄俊鎭?;
  renderCards();
});
</script>

</body>
</html>
